<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIR2026_2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #F5F5F5;
      font-family: Arial, sans-serif;
    }
    .contenedor {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 20px 40px 20px;
    }

    /* HEADER CON LOGO MÁS GRANDE */
    .header-institucional {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      position: relative;
    }
    .logo-container {
      width: 240px; /* Logo agrandado */
    }
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .header-texto {
      flex: 1;
      text-align: center;
      margin-right: 240px; /* Compensa el logo para que el título quede centrado */
    }
    h1 {
      color: #1A1A1A;
      margin: 0;
      font-size: 26px;
    }
    p.subtitulo {
      color: #4D4D4D;
      margin: 6px 0 0 0;
      font-size: 15px;
    }

    /* TÍTULO DE BLOQUE */
    .bloque-titulo {
      font-size: 18px;
      font-weight: bold;
      color: #1A1A1A;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bloque-titulo::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 18px;
      background-color: #E35210;
      border-radius: 2px;
    }

    /* BLOQUE 1: SECCIÓN A AISLADA */
    .bloque-seccion-a {
      margin-bottom: 40px;
    }
    .marco-seccion-a {
      border: 2px solid #E35210;
      border-radius: 8px;
      overflow: hidden;
      background: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* BLOQUE 2: DEMÁS SECCIONES CON PESTAÑAS */
    .bloque-otras-secciones {
      margin-top: 20px;
    }
    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: -2px;
      padding-left: 10px;
    }
    .tab-btn {
      background: #E5E5E5;
      border: 2px solid #C5C5C5;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: bold;
      color: #4A4A4A;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: #ECECEC;
      color: #1A1A1A;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: #E35210;
      border-color: #E35210;
      border-bottom: 2px solid #FFFFFF;
      position: relative;
      z-index: 2;
    }

    /* MARCO DEL REPORTE INFERIOR */
    .marco-iframe {
      border: 2px solid #E35210;
      border-radius: 0 8px 8px 8px;
      overflow: hidden;
      background: #FFFFFF;
      position: relative;
      z-index: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    iframe {
      width: 100%;
      height: 900px;
      border: none;
      display: block;
    }

    /* Responsivo para móviles y tablets */
    @media (max-width: 900px) {
      .header-institucional {
        flex-direction: column;
        gap: 15px;
      }
      .header-texto {
        margin-right: 0;
      }
      .logo-container {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="contenedor">
    
    <!-- Encabezado con Logo y Título -->
    <header class="header-institucional">
      <div class="logo-container">
        <img src="logo-udla.png" alt="Logo UDLA">
      </div>
      <div class="header-texto">
        <h1>PIR2026_2</h1>
        <p class="subtitulo">Universidad de Las Américas — Chile</p>
      </div>
    </header>

    <!-- BLOQUE 1: SECCIÓN A SOLA -->
    <section class="bloque-seccion-a">
      <div class="bloque-titulo">Sección A: Datos sociodemográficos</div>
      <div class="marco-seccion-a">
        <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/Ga56F" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
    </section>

    <!-- BLOQUE 2: OTRAS SECCIONES EN PESTAÑAS -->
    <section class="bloque-otras-secciones">
      <div class="bloque-titulo">Dimensiones y Escalas de Evaluación</div>
      
      <!-- Barra de pestañas (de B a J) -->
      <div class="tabs-bar">
        <button class="tab-btn active" onclick="cambiarPestana(event, 'tab-sec-b')">Sección B: Carga de trabajo</button>
        <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-c')">Sección C: Control algorítmico</button>
        <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-d')">Sección D: Autonomía laboral</button>
        <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-e')">Sección E: Transparencia algorítmica</button>
        <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-f')">Sección F: Tecnoestrés</button>
        <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-h')">Sección H: Burnout</button>
        <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-j')">Sección J: Desempeño laboral</button>
      </div>

      <!-- Contenedor dinámico de las pestañas -->
      <div class="marco-iframe">
        
        <!-- Pestaña B (activa por defecto en este bloque) -->
        <div id="tab-sec-b" class="tab-content active">
          <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_a03eecza7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

        <!-- Pestaña C -->
        <div id="tab-sec-c" class="tab-content">
          <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_6ho5tcza7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

        <!-- Pestaña D -->
        <div id="tab-sec-d" class="tab-content">
          <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_3owkvcza7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

        <!-- Pestaña E -->
        <div id="tab-sec-e" class="tab-content">
          <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_x86avppi7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

        <!-- Pestaña F -->
        <div id="tab-sec-f" class="tab-content">
          <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_043oyppi7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

        <!-- Pestaña H -->
        <div id="tab-sec-h" class="tab-content">
          <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_3sd4pqpi7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

        <!-- Pestaña J -->
        <div id="tab-sec-j" class="tab-content">
          <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_6yi2qqpi7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

      </div>
    </section>

  </div>

  <script>
    function cambiarPestana(evt, tabId) {
      const contenidos = document.querySelectorAll('.tab-content');
      contenidos.forEach(c => c.classList.remove('active'));

      const botones = document.querySelectorAll('.tab-btn');
      botones.forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
