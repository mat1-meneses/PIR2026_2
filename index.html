<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIR2026_2</title>
  <style>
    :root {
      /* Cambia este valor para agrandar o achicar el logo */
      --logo-ancho: 420px;
    }

    body {
      margin: 0;
      padding: 0;
      background: #F5F5F5;
      font-family: Arial, sans-serif;
    }
    .contenedor {
      max-width: 1350px;
      margin: 20px auto;
      padding: 0 20px 40px 20px;
    }

    /* HEADER */
    .header-institucional {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }
    .logo-container {
      width: var(--logo-ancho);
      flex-shrink: 0;
    }
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .header-texto {
      flex: 1;
      text-align: center;
      margin-right: var(--logo-ancho); /* mismo valor que el logo para que el título quede centrado */
    }
    h1 {
      color: #1A1A1A;
      margin: 0;
      font-size: 26px;
    }
    p.subtitulo {
      color: #4D4D4D;
      margin: 5px 0 0 0;
      font-size: 15px;
    }

    /* TITULOS DE BLOQUES */
    .bloque-header {
      font-size: 18px;
      font-weight: bold;
      color: #1A1A1A;
      margin: 25px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bloque-header::before {
      content: "";
      width: 6px;
      height: 20px;
      background-color: #E35210;
      border-radius: 2px;
      display: inline-block;
    }

    /* Separación clara entre el bloque A y el bloque de pestañas */
    .separador {
      border: 0;
      border-top: 2px dashed #BDBDBD;
      margin: 60px 0 10px 0;
    }

    /* BLOQUE 1: SECCIÓN A */
    .marco-seccion-a {
      border: 2px solid #E35210;
      border-radius: 8px;
      overflow: hidden;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .marco-seccion-a iframe {
      width: 100%;
      height: 850px;
      border: none;
      display: block;
    }

    /* BLOQUE 2: PESTAÑAS (B a J) */
    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: -2px;
      padding-left: 10px;
    }
    .tab-btn {
      background: #E2E2E2;
      border: 2px solid #BDBDBD;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: bold;
      color: #4A4A4A;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: #ECECEC;
      color: #1A1A1A;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: #E35210;
      border-color: #E35210;
      border-bottom: 2px solid #FFFFFF;
      position: relative;
      z-index: 2;
    }

    .marco-iframe {
      border: 2px solid #E35210;
      border-radius: 0 8px 8px 8px;
      overflow: hidden;
      background: #FFFFFF;
      position: relative;
      z-index: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .marco-iframe iframe {
      width: 100%;
      height: 950px;
      border: none;
      display: block;
    }

    @media (max-width: 900px) {
      :root {
        --logo-ancho: 280px;
      }
      .header-institucional {
        flex-direction: column;
        gap: 15px;
      }
      .header-texto {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="contenedor">

    <!-- Encabezado institucional -->
    <header class="header-institucional">
      <div class="logo-container">
        <img src="logo-udla.png" alt="Logo Universidad de Las Américas">
      </div>
      <div class="header-texto">
        <h1>PIR2026_2</h1>
        <p class="subtitulo">Universidad de Las Américas — Chile</p>
      </div>
    </header>

    <!-- BLOQUE 1: SECCIÓN A AISLADA -->
    <div class="bloque-header">Sección A: Datos sociodemográficos</div>
    <div class="marco-seccion-a">
      <iframe src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/Ga56F" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>

    <hr class="separador">

    <!-- BLOQUE 2: OTRAS SECCIONES EN PESTAÑAS -->
    <div class="bloque-header">Dimensiones del Estudio</div>
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="cambiarPestana(event, 'tab-sec-b')">Sección B: Carga de trabajo</button>
      <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-c')">Sección C: Control algorítmico</button>
      <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-d')">Sección D: Autonomía laboral</button>
      <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-e')">Sección E: Transparencia algorítmica</button>
      <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-f')">Sección F: Tecnoestrés</button>
      <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-h')">Sección H: Burnout</button>
      <button class="tab-btn" onclick="cambiarPestana(event, 'tab-sec-j')">Sección J: Desempeño laboral</button>
    </div>

    <!-- Los iframes usan data-src: cada uno se carga solo cuando se abre su pestaña -->
    <div class="marco-iframe">
      <div id="tab-sec-b" class="tab-content active">
        <iframe data-src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_a03eecza7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
      <div id="tab-sec-c" class="tab-content">
        <iframe data-src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_6ho5tcza7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
      <div id="tab-sec-d" class="tab-content">
        <iframe data-src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_3owkvcza7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
      <div id="tab-sec-e" class="tab-content">
        <iframe data-src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_x86avppi7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
      <div id="tab-sec-f" class="tab-content">
        <iframe data-src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_043oyppi7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
      <div id="tab-sec-h" class="tab-content">
        <iframe data-src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_3sd4pqpi7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
      <div id="tab-sec-j" class="tab-content">
        <iframe data-src="https://datastudio.google.com/embed/reporting/e68a0b41-d900-4813-89d4-76f87aabeb6f/page/p_6yi2qqpi7d" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
    </div>

  </div>

  <script>
    // Carga el iframe de una pestaña solo la primera vez que se muestra
    function cargarIframe(contenedor) {
      const iframe = contenedor.querySelector('iframe[data-src]');
      if (iframe) {
        iframe.src = iframe.getAttribute('data-src');
        iframe.removeAttribute('data-src');
      }
    }

    function cambiarPestana(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      const destino = document.getElementById(tabId);
      destino.classList.add('active');
      evt.currentTarget.classList.add('active');
      cargarIframe(destino);
    }

    // Carga la pestaña activa al abrir la página (Sección B)
    document.addEventListener('DOMContentLoaded', function () {
      cargarIframe(document.querySelector('.tab-content.active'));
    });
  </script>
</body>
</html>
